services:
    db:
        image: postgres
        environment: 
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=auth
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
    redis:
        image: redis:alpine
        ports:
            - "6379:6379"
volumes:
    postgres_data:
